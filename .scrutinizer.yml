filter:
    excluded_paths:
        - "*/tests/*"
        - "services/rest-api/coverage/*"
    dependency_paths:

        - "*/node_modules/*"
build:
  nodes:
    coverage:
      tests:
        override:
          - command: npm run test
            coverage:
              file: services/rest-api/coverage/coverage.xml   # <- Set this to where we find the coverage data.
                                          #    The path is relative to the current directory.
              format: clover

