filter:
    excluded_paths:
        - "*/tests/*"
        - "services/rest-api/coverage/*"
    dependency_paths:

        - "*/node_modules/*"
build:
  nodes:
    analysis:
        tests:
            override:
                - js-scrutinizer-run
    coverage:
      tests:
        override:
          - command: npm run test
            coverage:
              file: ./services/rest-api/coverage/clover.xml   # <- Set this to where we find the coverage data.
                                          #    The path is relative to the current directory.
              format: clover

