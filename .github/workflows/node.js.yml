name: Node.js CI

on:
  push:
    branches: ["main", "tests", "tests-aug"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]
        mongodb-version: ["4.4", "5.0", "6.0"]

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.7.0
        with:
          mongodb-version: ${{ matrix.mongodb-version }}

      - name: Wait for MongoDB to be ready
        run: |
          # Wait for MongoDB to be accessible (it may take a few seconds)
          while ! nc -z mongo_db 27017; do
            echo "Waiting for MongoDB to be ready..."
            sleep 1
          done

      - name: Set environment variable for MongoDB URI
        run: echo "DB_TEST_URI=mongodb://root:example@mongo_db:27017/testDatabase?authSource=admin" >> $GITHUB_ENV

      - run: npm install
        working-directory: services/rest-api

      - run: npm run test
        working-directory: services/rest-api
